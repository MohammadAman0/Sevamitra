<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SevaMitra Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <h1>SevaMitra</h1>

        <p>Admin Panel</p>

    </header>


    <main>

        <section class="booking-container">

            <h2>Admin Login</h2>

            <p>
                Login to manage SevaMitra bookings
                and professionals.
            </p>


            <form id="adminLoginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="admin.js">
    </script>
<script src="site.js"></script>
</body>

</html>
