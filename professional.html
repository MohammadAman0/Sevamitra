<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Registration - SevaMitra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="sevaLoader">

    <div class="seva-loader-content">

        <img
            src="images/logo.png"
            alt="SevaMitra"
            class="seva-loader-logo"
        >

        <div class="seva-loader-title">
            SEVAMITRA
        </div>

        <div class="seva-loader-text">
            Har Kaam, Ek Trusted Mitra
        </div>

    </div>

</div>
<header>
    <h1>SevaMitra</h1>
    <p>Join as a Professional</p>
</header>

<main>

    <section class="booking-container">

        <h2>Professional Registration</h2>

        <p>
            Register with SevaMitra and provide your services
            to customers.
        </p>

        <form id="professionalForm">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <label>Service Category</label>

            <select name="service" required>

                <option value="">
                    Select Service
                </option>

                <option value="Electrician">
                    Electrician
                </option>

                <option value="Plumber">
                    Plumber
                </option>

                <option value="Carpenter">
                    Carpenter
                </option>

                <option value="AC Repair">
                    AC Repair
                </option>

                <option value="Painter">
                    Painter
                </option>

                <option value="Cleaning">
                    Cleaning
                </option>

                <option value="Appliance Repair">
                    Appliance Repair
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <label>Experience</label>

            <input
                type="number"
                name="experience"
                placeholder="Experience in years"
                min="0"
                required
            >

            <label>City</label>

            <input
                type="text"
                name="city"
                placeholder="Enter your city"
                required
            >

            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter your complete address"
                required
            ></textarea>

            <label>Skills</label>

            <textarea
                name="skills"
                placeholder="Example: Fan repair, wiring, switch repair"
                required
            ></textarea>

            <button type="submit">
                Register as Professional
            </button>

        </form>

    </section>

</main>

<script type="module" src="professional.js"></script>
<script src="site.js"></script>
</body>

</html>
