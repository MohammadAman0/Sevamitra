<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Registration - SevaMitra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SevaMitra</h1>
    <p>Professional Registration</p>
</header>

<main>

    <section class="booking-container">

        <h2>Join as a Professional</h2>

        <p>
            Register yourself as a service professional.
            Your profile will be reviewed by SevaMitra Admin.
        </p>

        <form id="professionalForm">

            <label>Full Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Mobile Number</label>
            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <label>Service Category</label>
            <select name="service" required>
                <option value="">Select Service</option>
                <option value="Electrician">Electrician</option>
                <option value="Plumber">Plumber</option>
                <option value="Carpenter">Carpenter</option>
                <option value="AC Repair">AC Repair</option>
                <option value="Painter">Painter</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Appliance Repair">Appliance Repair</option>
                <option value="Other">Other</option>
            </select>

            <label>Experience</label>
            <input
                type="number"
                name="experience"
                placeholder="Experience in years"
                min="0"
                required
            >

            <label>City</label>
            <input
                type="text"
                name="city"
                placeholder="Enter city"
                required
            >

            <label>Address</label>
            <textarea
                name="address"
                placeholder="Enter your complete address"
                required
            ></textarea>

            <label>Skills</label>
            <textarea
                name="skills"
                placeholder="Example: Wiring, Fan repair, Switch repair"
                required
            ></textarea>

            <button type="submit">
                Register as Professional
            </button>

        </form>

    </section>

</main>

<script type="module" src="professional.js"></script>

</body>
</html>
