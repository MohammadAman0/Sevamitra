    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Registration - SevaMitra</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="professional.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="shortcut icon" type="image/png" href="/images/favicon.png">
</head>

<body>

<header>
    <h1>SevaMitra</h1>
    <p>Join as a Professional</p>
</header>

<main>

    <section class="booking-container">

        <h2>Professional Registration</h2>

        <p>
            Register with SevaMitra and provide your services
            to customers.
        </p>

        <form id="professionalForm">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <label>Service Category</label>

            <select name="service" required>

                <option value="">
                    Select Service
                </option>

                <option value="Electrician">
                    Electrician
                </option>

                <option value="Plumber">
                    Plumber
                </option>

                <option value="Carpenter">
                    Carpenter
                </option>

                <option value="AC Repair">
                    AC Repair
                </option>

                <option value="Painter">
                    Painter
                </option>

                <option value="Cleaning">
                    Cleaning
                </option>

                <option value="Appliance Repair">
                    Appliance Repair
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <label>Experience</label>

            <input
                type="number"
                name="experience"
                placeholder="Experience in years"
                min="0"
                required
            >

            <label>City</label>

            <input
                type="text"
                name="city"
                placeholder="Enter your city"
                required
            >

            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter your complete address"
                required
            ></textarea>

            <label>Skills</label>

            <textarea
                name="skills"
                placeholder="Example: Fan repair, wiring, switch repair"
                required
            ></textarea>
<div style="margin: 20px 0; font-size: 14px; line-height: 1.6;">

    <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer;">

        <input type="checkbox"
               id="workerTerms"
               name="termsAccepted"
               value="yes"
               required
               style="width: 18px; height: 18px; flex-shrink: 0; margin-top: 3px;">

        <span>
            I have read, understood and agree to SevaMitra's
            <a href="terms.html"
               target="_blank"
               rel="noopener noreferrer"
               style="color: #087b73; font-weight: bold;">
                Terms & Conditions
            </a>.
        </span>

    </label>

</div>
            <button type="submit">
                Register as Professional
            </button>

        </form>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module" src="professional.js"></script>

</body>

</html>
