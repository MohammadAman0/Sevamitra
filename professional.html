<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register as Professional - SevaMitra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>SevaMitra</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="booking.html">Book a Service</a>
        <a href="professional.html">Register as Professional</a>
        <a href="help.html">Get Help</a>
    </nav>
</header>

<main>

<section>
    <h2>Register as a Service Professional</h2>

    <p>
        Join SevaMitra and receive local service opportunities.
        Submit your details and our team will contact you for verification.
    </p>

    <form>

        <div>
            <label>Your Name</label><br>
            <input type="text" name="name" placeholder="Enter your name" required>
        </div>

        <br>

        <div>
            <label>Mobile Number</label><br>
            <input type="tel" name="mobile" placeholder="Enter mobile number" required>
        </div>

        <br>

        <div>
            <label>Service / Skill</label><br>
            <select name="service" required>
                <option value="">Select your service</option>
                <option>Plumber</option>
                <option>Electrician</option>
                <option>Carpenter</option>
                <option>Home Cleaning</option>
                <option>Bathroom Cleaning</option>
                <option>Laundry</option>
                <option>AC Repair</option>
                <option>Appliance Repair</option>
                <option>Other</option>
            </select>
        </div>

        <br>

        <div>
            <label>Experience</label><br>
            <input type="text" name="experience" placeholder="Example: 3 years">
        </div>

        <br>

        <div>
            <label>Service Area</label><br>
            <input type="text" name="area" placeholder="Example: Betul">
        </div>

        <br>

        <div>
            <label>About Your Work</label><br>
            <textarea
                name="about"
                rows="5"
                placeholder="Tell us about your skills and experience">
            </textarea>
        </div>

        <br>

        <button type="submit">Submit Registration</button>

    </form>

</section>

</main>

<footer>
    <p>© 2026 SevaMitra. All rights reserved.</p>
</footer>

</body>
</html>
