<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SevaMitra Admin Panel</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>
<div id="sevaLoader">

    <div class="seva-loader-content">

        <img
            src="images/logo.png"
            alt="SevaMitra"
            class="seva-loader-logo"
        >

        <div class="seva-loader-title">
            SEVAMITRA
        </div>

        <div class="seva-loader-text">
            Har Kaam, Ek Trusted Mitra
        </div>

    </div>

</div>
    <header>

        <h1>SevaMitra Admin</h1>

        <p>Manage your service platform</p>

    </header>


    <main>

        <section class="booking-container">

            <h2>Admin Dashboard</h2>


            <p id="adminStatus">
                Checking login...
            </p>


            <div>

                <button id="bookingsButton">
                    Customer Bookings
                </button>


                <button id="professionalsButton">
                    Professional Applications
                </button>


                <button id="logoutButton">
                    Logout
                </button>

            </div>


            <div id="dashboardContent">

                <h3>Welcome to SevaMitra Admin Panel</h3>

                <p>
                    From here you will manage customers,
                    professionals and bookings.
                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="admin-panel.js">
    </script>
<script src="site.js"></script>
</body>

</html>
